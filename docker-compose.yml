services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: stoxlens
      POSTGRES_USER: stoxlens
      POSTGRES_PASSWORD: stoxlens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://stoxlens:stoxlens@db/stoxlens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
    depends_on: [db]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]

volumes:
  pgdata:
